{% extends 'base3.html' %}
{% block title %}{{ page_name }}{% endblock %}

{% load i18n %}
{% load league_tags %}
{% load user_agents %}


{% block content %}
<h1 class="page-title"><i class="fas fa-calendar-alt"></i> Team Fixtures</h1>


  <div class="filter-section">
    <form method="get" action="{% url 'team_fixtures' %}">
      <label>Filter by:</label>
    <select name="team" class="form-select" onchange="this.form.submit()">
        <option value="" {% if not selected_team %}selected{% endif %}>All Teams</option>
        {% for team in teams %}
            <option value="{{ team }}" {% if selected_team == team %}selected{% endif %}>{{ team }}</option>
        {% endfor %}
    </select>
    </form>
  </div>
  {% include 'content/team_fixtures_list.html' with fixtures=fixtures %}
{% endblock %}
